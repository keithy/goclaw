# Sandbox overlay — enables Podman-based sandbox for agent code execution.
#
# Prerequisites:
#   1. Build the sandbox image:  docker build -t goclaw-sandbox:bookworm-slim -f Dockerfile.sandbox .
#   2. Ensure Podman socket is accessible at /run/user/1000/podman/podman.sock
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.sandpod.yml up
#
# SECURITY NOTE: Mounting Podman socket gives the container control over host Podman.
# Only use in trusted environments where agent code execution isolation is required.

services:
  goclaw:
    build:
      args:
        ENABLE_SANDBOX: "true"
    volumes:
      # Mount Podman socket
      - /run/user/1003/podman/podman.sock:/var/run/docker.sock
    environment:
      - GOCLAW_SANDBOX_MODE=all
      - GOCLAW_SANDBOX_IMAGE=goclaw-sandbox:bookworm-slim
      - GOCLAW_SANDBOX_WORKSPACE_ACCESS=rw
      - GOCLAW_SANDBOX_SCOPE=session
      - GOCLAW_SANDBOX_MEMORY_MB=512
      - GOCLAW_SANDBOX_CPUS=1.0
      - GOCLAW_SANDBOX_TIMEOUT_SEC=300
      - GOCLAW_SANDBOX_NETWORK=false
      # Point Docker client to Podman socket
      - DOCKER_HOST=unix:///var/run/docker.sock
    # Override base cap_drop to allow Podman socket access
    cap_drop: []
    cap_add:
      - NET_BIND_SERVICE
    security_opt: []
